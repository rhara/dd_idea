<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  #stack { position: relative; width: 100%; }
  #stack iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: none; opacity: 0; transition: opacity 0.15s ease-in-out;
  }
  #stack iframe.active { opacity: 1; z-index: 1; }
</style>
</head>
<body>
<div id="stack">
  <iframe id="frameA" title="scene-a"></iframe>
  <iframe id="frameB" title="scene-b"></iframe>
</div>
<script>
// Double-buffered display for py3Dmol scenes embedded via plviewerlib.
//
// A plain st.iframe(html) call swaps the iframe's srcdoc on every Streamlit
// rerun; the browser tears down the old document immediately, so there's a
// visible blank flash before the new scene finishes loading its JS,
// re-parsing the model, and re-rendering. Because this is a *static*
// Streamlit component, its own outer iframe is loaded exactly once (its src
// is a fixed local URL that never changes across reruns) and Streamlit talks
// to it via postMessage instead of reloading it -- so this script can stay
// alive across reruns and keep two hidden/visible inner iframes, loading a
// new scene into the currently-hidden one and only swapping visibility once
// that scene reports (via its own postMessage, injected by
// scene.html_with_camera_events) that it has actually finished painting.
//
// The same always-alive JS context also carries the camera position
// (rotation/zoom) across scenes: each scene reports its `getView()` state on
// every drag/zoom, we keep the latest one in `lastView`, and stamp it into
// the *next* scene's HTML (as a post-render setView() call) before loading
// it -- sessionStorage looked simpler at first but each srcdoc-loaded scene
// turned out to get its own isolated storage partition even when nested in
// the same component, so nothing actually persisted through it.

function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}

var frames = {A: document.getElementById("frameA"), B: document.getElementById("frameB")};
var activeKey = null;      // "A" or "B" -- which buffer is currently visible
var pendingKey = null;     // buffer currently loading a new scene, awaiting its ready signal
var currentHtml = null;    // last scene html we were asked to show (dedupe redundant reruns)
var lastView = null;       // most recent camera state (3Dmol getView() array)
var lastResetToken = null; // last-seen reset_token prop; a change clears lastView
var __plvSendTimer = null; // debounce handle for the server-side setComponentValue report
var __plvLastSentJson = null; // JSON of the last view actually sent via setComponentValue (breaks the report->rerun->fresh-scene->report loop -- see below)

function otherKey(k) { return k === "A" ? "B" : "A"; }

function showFrame(key) {
  frames.A.classList.toggle("active", key === "A");
  frames.B.classList.toggle("active", key === "B");
  activeKey = key;
}

function withCameraRestore(html) {
  if (!lastView) return html;
  var m = html.match(/viewer_(\d+)\.render\(\);/);
  if (!m) return html;
  var viewerVar = "viewer_" + m[1];
  var snippet = "\ntry { " + viewerVar + ".setView(" + JSON.stringify(lastView) + "); "
    + viewerVar + ".render(); } catch (e) {}\n";
  return html.replace(m[0], m[0] + snippet);
}

function loadScene(html) {
  var targetKey = activeKey === null ? "A" : otherKey(activeKey);
  pendingKey = targetKey;
  frames[targetKey].srcdoc = withCameraRestore(html);
}

function requestResize(key) {
  if (!key) return;
  frames[key].contentWindow.postMessage({plviewerDoResize: true}, "*");
}

function onSceneReady(key) {
  if (key !== pendingKey) return;
  pendingKey = null;
  var previousKey = activeKey;
  showFrame(key);
  // The scene's own script (see htmlpatch.html_with_camera_events) can't
  // reliably resize its WebGL canvas to fit before this point -- while
  // frames[key] was still hidden (opacity: 0, pre-swap), its containing
  // div read as 0 width/height, and 3Dmol.js never revisits a canvas size
  // it already picked. Now that showFrame() just made it visible, ask it
  // to resize for real. This alone isn't sufficient when the *whole
  // component* is sitting inside a Streamlit tab that isn't the active one
  // at the time this runs (a real case: the Structure overlay tab isn't
  // selected on first load, so this component's own outer iframe -- not
  // just frameA/frameB -- reads 0x0 here too) -- the ResizeObserver below
  // covers that case by re-requesting a resize once the component's own
  // container actually gets a real size, whenever that ends up happening.
  requestResize(key);
  if (previousKey && previousKey !== key) {
    // Release the now-hidden frame's WebGL context/geometry once the
    // cross-fade finishes, so repeated swaps don't leak GL contexts.
    setTimeout(function() {
      frames[previousKey].srcdoc = "about:blank";
    }, 250);
  }
}

// Covers the Streamlit-tab-not-yet-visible case above: this component's own
// container has no size (e.g. an inactive `st.tabs()` pane), so neither the
// initial resize request nor `.active`'s opacity flip -- both already
// handled above -- can produce a correctly-sized canvas. Once the browser
// actually lays this element out at a nonzero size (the user clicks the
// tab), ask the currently-active frame to resize again. Polls on a plain
// `setInterval`, not a `ResizeObserver` -- deliberately: a `ResizeObserver`
// is itself driven by the same rendering-pipeline hook `requestAnimationFrame`
// is, and this component's own outer iframe is exactly the "not currently
// visible" case that hook gets throttled (in some environments, indefinitely)
// for, confirmed live: a freshly-`observe()`d ResizeObserver here never fired
// its callback even once -- not even the always-fires-immediately initial
// report ResizeObserver normally guarantees -- while `stack`'s own
// `getBoundingClientRect()` already reported the correct, later size the
// whole time. `setInterval` doesn't share that dependency.
var __lastPolledSize = {width: 0, height: 0};
setInterval(function() {
  var rect = document.getElementById("stack").getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0 &&
      (rect.width !== __lastPolledSize.width || rect.height !== __lastPolledSize.height)) {
    __lastPolledSize = {width: rect.width, height: rect.height};
    requestResize(activeKey);
  }
}, 200);

window.addEventListener("message", function(event) {
  var data = event.data || {};
  if (data.type === "streamlit:render") {
    var args = data.args || {};
    var height = args.height || 650;
    document.getElementById("stack").style.height = height + "px";
    sendToStreamlit("streamlit:setFrameHeight", {height: height});
    if (args.reset_token !== undefined) {
      if (lastResetToken !== null && args.reset_token !== lastResetToken) {
        lastView = null;
      }
      lastResetToken = args.reset_token;
    }
    if (args.html && args.html !== currentHtml) {
      currentHtml = args.html;
      loadScene(args.html);
    }
    return;
  }
  if (data.plviewerCameraUpdate) {
    lastView = data.view;
    // Also hand the view back to Python via the component's own return
    // value (Streamlit.setComponentValue's raw postMessage form -- this
    // component hand-rolls the protocol rather than pulling in
    // streamlit-component-lib). This is the resilient path: `lastView`
    // above only survives as long as this outer component iframe's own JS
    // context does, and a live comparison against a real six-protein
    // report showed Streamlit *does* sometimes tear down and recreate
    // that iframe from scratch on an ordinary widget rerun (confirmed by
    // a marker stashed on its `contentWindow` disappearing across the
    // rerun) -- when that happens `lastView` here is gone too, and the
    // next scene falls through to its own default `zoomTo()` fit. Storing
    // the view server-side in `st.session_state` (see `view.py`) and
    // baking it into the *next* scene's HTML via `html_with_initial_view`
    // before it's ever sent to the browser survives that regardless of
    // what this iframe's own JS memory does.
    //
    // Debounced, not sent on every update: `setComponentValue` is exactly
    // what makes a custom component *interactive* in Streamlit -- every
    // call whose value differs from the last schedules a full app rerun.
    // The scene reports a change on every drag/zoom tick *and* every
    // 250ms poll tick (see `htmlpatch.py`), so calling this unthrottled
    // turned camera dragging into a rerun storm that visibly fought with
    // itself (confirmed live: the component kept flipping back to a
    // blank/loading buffer mid-drag). Only fire it 400ms after the *last*
    // reported change, so one settled camera position produces one rerun
    // -- same debounce shape as a search-as-you-type box.
    //
    // Also skip the call outright if this value is the same one we last
    // actually sent: `view.py` calls `_make_html()` fresh on every rerun,
    // which -- regardless of whether the *content* changed -- always picks
    // a brand-new random `viewer_NNN` suffix (see `htmlpatch.get_viewer_
    // variable`'s docstring), so the component always treats it as a
    // genuinely new scene and reloads it. That reload's own initial-paint
    // self-report (see `html_with_camera_events`) would otherwise feed the
    // *same* view right back into this same handler, scheduling *another*
    // send, causing another rerun, another fresh-suffix scene, another
    // self-report -- a closed loop with no camera drag involved at all,
    // confirmed live (the component kept reloading on its own with the
    // debug session_state readout never advancing past the scene's
    // *default* view). Comparing against the last value we actually
    // dispatched (not just the last one seen) breaks that loop while still
    // sending every genuinely new position exactly once.
    var __plvJson = JSON.stringify(lastView);
    if (__plvJson === __plvLastSentJson) return;
    clearTimeout(__plvSendTimer);
    __plvSendTimer = setTimeout(function() {
      __plvLastSentJson = __plvJson;
      sendToStreamlit("streamlit:setComponentValue", {value: lastView, dataType: "json"});
    }, 400);
    return;
  }
  if (data.plviewerReady && event.source) {
    if (event.source === frames.A.contentWindow) onSceneReady("A");
    else if (event.source === frames.B.contentWindow) onSceneReady("B");
  }
});

window.addEventListener("DOMContentLoaded", function() {
  sendToStreamlit("streamlit:componentReady", {apiVersion: 1});
});
</script>
</body>
</html>
